<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Water Goal</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; background: #f0f8ff; color: #005c99; padding: 20px; margin: 0; }
        h1 { margin: 10px 0 5px; font-size: 28px; }
        p { margin: 0; color: #66b3ff; font-weight: bold; }
        .total { font-size: 42px; font-weight: 800; margin: 15px 0; color: #0073e6; }
        .progress-container { width: 100%; background: #cce6ff; border-radius: 20px; overflow: hidden; margin: 20px 0; height: 35px; border: 2px solid #99ccff; }
        .progress-bar { height: 100%; background: #3399ff; width: 0%; transition: width 0.4s ease; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; }
        .btn { display: block; width: 100%; padding: 18px; margin: 12px 0; background: #ffffff; border: 2px solid #3399ff; border-radius: 16px; font-size: 18px; font-weight: 700; color: #0073e6; cursor: pointer; box-shadow: 0 4px 6px rgba(0,115,230,0.1); }
        .btn:active { background: #e6f2ff; transform: scale(0.98); }
        .history { margin-top: 35px; text-align: left; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .history h2 { margin-top: 0; font-size: 20px; color: #005c99; border-bottom: 2px solid #f0f8ff; padding-bottom: 10px; }
        ul { list-style-type: none; padding: 0; margin: 0; }
        li { padding: 12px 0; border-bottom: 1px solid #f0f8ff; display: flex; justify-content: space-between; font-size: 16px; }
        li:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <h1>Water Tracker</h1>
    <p>Daily Goal: 2500 ml</p>
    <div class="total" id="today-total">0 ml</div>

    <div class="progress-container">
        <div class="progress-bar" id="progress"></div>
    </div>

    <button class="btn" onclick="addWater(150)">💧 Small Glass (150 ml)</button>
    <button class="btn" onclick="addWater(400)">🚰 Large Glass (400 ml)</button>
    <button class="btn" onclick="addWater(500)">🥤 Thermos (500 ml)</button>
    <button class="btn" onclick="addCustom()">➕ Custom Amount</button>

    <div class="history">
        <h2>History</h2>
        <ul id="history-list"></ul>
    </div>

    <script>
        const goal = 2500;
        let records = JSON.parse(localStorage.getItem('waterData')) || {};

        function getDateStr() {
            return new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
        }

        function addWater(amount) {
            const today = getDateStr();
            if (!records[today]) records[today] = 0;
            records[today] += amount;
            localStorage.setItem('waterData', JSON.stringify(records));
            updateUI();
        }

        function addCustom() {
            let val = prompt("Enter amount in ml:");
            let amount = parseInt(val);
            if (!isNaN(amount) && amount > 0) addWater(amount);
        }

        function updateUI() {
            const today = getDateStr();
            const total = records[today] || 0;
            document.getElementById('today-total').innerText = total + " ml";
            
            let percent = (total / goal) * 100;
            if (percent > 100) percent = 100;
            let bar = document.getElementById('progress');
            bar.style.width = percent + "%";
            bar.innerText = Math.round(percent) + "%";

            const list = document.getElementById('history-list');
            list.innerHTML = "";
            
            const dates = Object.keys(records).sort((a, b) => new Date(b) - new Date(a));
            
            dates.forEach(date => {
                let li = document.createElement('li');
                let displayDate = (date === today) ? "Today" : date;
                li.innerHTML = `<span>${displayDate}</span> <span><b>${records[date]} ml</b></span>`;
                list.appendChild(li);
            });
        }

        updateUI();
    </script>
</body>
</html>
